### ────────────────────────────────────────────────────────────────────────
###  TMUX CONFIG  (single-file)
###
###  Everything lives in this one file, in load order:
###    1. base / server options
###    2. variables & plugin manager path
###    3. session & window options
###    4. keybindings
###    5. theme / colors (TokyoNight night)
###    6. plugin settings (@options) — MUST come before `run tpm`
###    7. plugin list
###    8. local overrides (post-plugin, win over plugin defaults)
###    9. TPM bootstrap (runs last)
### ────────────────────────────────────────────────────────────────────────

# Base directory for this config, used by the reload binding below.
# NOTE: single quotes + '~' do NOT expand in tmux, so use $HOME here.
setenv -g TMUXDOTDIR "$HOME/.config/tmux"


### ─── 1. Base / server options ─────────────────────────────────────────────

# Modern, 256-color + truecolor capable terminal by default.
set -g default-terminal "tmux-256color"

# Truecolor (24-bit) passthrough for terminals that support it.
set -ga terminal-overrides ",*256col*:Tc,xterm-*:Tc,alacritty:Tc,wezterm:Tc"

# No delay after Escape (important for vi mode and Neovim inside tmux).
set -sg escape-time 10

# Larger scrollback buffer.
set -g history-limit 50000

# Allow apps (vim/nvim, fzf) to set the clipboard via OSC 52.
set -g set-clipboard on

# Report pane focus to editors.
set -g focus-events on

# Index windows and panes from 1.
set -g base-index 1
setw -g pane-base-index 1


### ─── 2. Variables & plugin manager path ───────────────────────────────────

# Where plugins are installed (under the config dir, so it's self-contained).
set -g @plugin_dir "#{TMUXDOTDIR}/plugins"

# TPM looks here for plugins instead of the default ~/.tmux/plugins.
# NOTE: set-environment does NOT expand #{...} formats, so use $HOME literally.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"


### ─── 3. Session & window options ──────────────────────────────────────────

# Mouse: select/resize panes and windows, scroll into copy mode.
set -g mouse on

# Keep window numbers gapless when a window closes.
set -g renumber-windows on

# Let applications set the terminal title.
set -g set-titles on
set -g set-titles-string "#S:#I:#W"   # session:index:window

# Do not trigger an action on silence in monitored windows.
set -g silence-action none

# vi keys on the status/command line and in copy mode.
set -g status-keys vi
setw -g mode-keys vi

# Pane-number display colors (shown via `prefix + q`).
set -g display-panes-colour "#0599ff"
set -g display-panes-active-colour "#3aff00"

# How long (ms) pane numbers / messages stay on screen.
set -g display-panes-time 1500
set -g display-time 2000

# Monitor activity in other windows, but don't nag with a bell/message.
setw -g monitor-activity on
set -g visual-activity off

# Size each window to the smallest *attached* client actively viewing it.
setw -g aggressive-resize on


### ─── 4. Keybindings ───────────────────────────────────────────────────────
### Keeps the default prefix (C-b) and adds C-a as a second prefix. Bindings
### below are additive and chosen not to clobber common defaults.

# Secondary prefix: C-a works in addition to the default C-b.
set -g prefix2 C-a

# Reload this config without restarting tmux: `prefix + r`.
bind r source-file -F '#{TMUXDOTDIR}/tmux.conf' \; display-message "tmux.conf reloaded"

# Intuitive splits that keep the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vi-style pane navigation (prefix + h/j/k/l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi-style pane resizing, repeatable (hold the key after prefix).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-like copy-mode selection: v to start, y to yank.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Quick window switching with Alt+number (no prefix needed).
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5


### ─── 5. Theme — TokyoNight (night) ────────────────────────────────────────
### Upstream: https://github.com/folke/tokyonight.nvim (extras/tmux)

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#7aa2f7,bg=#1f2335"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#15161E,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1f2335,nobold,nounderscore,noitalics]"
set -g status-right "#{tmux_mode_indicator}#[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#1f2335] #{prefix_highlight} #[fg=#15161E]#{cpu_bg_color} CPU: #{cpu_percentage} #[fg=#3b4261,bg=#1f2335,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d %I:%M %p #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#bb9af7,bold] #h "

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-format "#[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1f2335,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#1f2335,nobold,nounderscore,noitalics]"


### ─── 6. Plugin settings (@options) ────────────────────────────────────────
### IMPORTANT: a plugin reads its @options when TPM sources it (the `run` line
### at the very bottom). So ALL plugin @options MUST be set ABOVE that line —
### here is the right place. Setting them after `run tpm` has no effect.
###
### Examples (uncomment / adjust as needed):
###   set -g @menus_trigger 'F12'                 # tmux-menus popup key
###   set -g @sidebar-tree-command 'tree -C'      # tmux-sidebar tree cmd
###   set -g @which-key-xdg-plugin-path '…'        # tmux-which-key

set -g @menus_trigger 'F12'  # tmux-menus popup key


### ─── 7. Plugin list ───────────────────────────────────────────────────────
### Kept in tmux.conf (the conventional TPM layout) so TPM (`prefix + I`) and
### tmux-menus both discover them. Add a line here, then press `prefix + I`.
set -g @plugin 'tmux-plugins/tpm'                         ## tmux plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'sk1418/retmux'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'


### ─── 8. Local overrides (post-plugin) ─────────────────────────────────────
### Anything here runs after the plugin list is declared. For overrides that
### must beat a plugin's own keybindings/styles, prefer re-binding AFTER the
### `run tpm` line below, or use a hook. Machine-specific tweaks go here.
###
### Example:
###   set -g status-position top


### ─── 9. Initialize TPM (keep at the very bottom) ──────────────────────────
### Only run if TPM is actually installed, otherwise fail silently.
### Install with: git clone https://github.com/tmux-plugins/tpm "$TMUXDOTDIR/plugins/tpm"
if-shell -F '#{TMUXDOTDIR}' \
  "run-shell -b 'test -x \"#{TMUXDOTDIR}/plugins/tpm/tpm\" && \"#{TMUXDOTDIR}/plugins/tpm/tpm\"'"
