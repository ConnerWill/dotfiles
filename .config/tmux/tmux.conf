### ────────────────────────────────────────────────────────────────────────
###  TMUX CONFIG  (entry point)
###
###  This file stays intentionally tiny. All real configuration lives in
###  init/*.conf and is autoloaded, in numeric order, by the glob below.
###
###  Load stages (see each file's header for details):
###    00_  base / server options
###    10_  variables & user options (@-options)
###    20_  session & window options
###    30_  keybindings
###    40_  theme / colors
###    50_  plugins + TPM bootstrap
###    90_  local overrides (last-wins)
###    99_  end-of-init notes
### ────────────────────────────────────────────────────────────────────────

# Base directory for this config, used for every relative source / plugin path.
# NOTE: single quotes + '~' do NOT expand in tmux, so use $HOME here.
setenv -g TMUXDOTDIR "$HOME/.config/tmux"

# Autoload every numbered init stage, in sorted (numeric) order.
#   * '[0-9]*' matches 00_… through 99_… and skips example_tmux.conf
#   * The path uses an UNQUOTED leading '~'. This matters for two reasons:
#       - tmux expands an unquoted '~' even inside a config file (a *quoted*
#         '~' would NOT expand and the glob would silently match nothing).
#       - TPM's plugin scanner can read this plain path and follow it to the
#         @plugin declarations in 50_plugins-init.conf, so `prefix + I` works.
#     Do NOT quote the path or switch to -F '#{TMUXDOTDIR}/...': the former
#     breaks tmux loading, the latter breaks TPM discovery.
#   * -q stays quiet if the glob matches nothing (fresh / partial checkout)
source-file -q ~/.config/tmux/init/[0-9]*.conf
                                                  
