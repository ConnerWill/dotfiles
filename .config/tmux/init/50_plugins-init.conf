
### List of plugins
set -g @plugin 'tmux-plugins/tpm'                         ## tmux plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'sk1418/retmux'


### Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
### Only run if TPM is actually installed, otherwise fail silently.
### Install with: git clone https://github.com/tmux-plugins/tpm "$TMUXDOTDIR/plugins/tpm"
if-shell -F '#{TMUXDOTDIR}' \
  "run-shell -b 'test -x \"#{TMUXDOTDIR}/plugins/tpm/tpm\" && \"#{TMUXDOTDIR}/plugins/tpm/tpm\"'"
