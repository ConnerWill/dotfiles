### ─── 30_ keybindings ──────────────────────────────────────────────────────
###
### Keep the default prefix (C-b) and add C-a as a second prefix. Additional
### bindings below are additive and chosen to be intuitive without clobbering
### common defaults.

# Secondary prefix: C-a works in addition to the default C-b.
set -g prefix2 C-a

# Reload this config without restarting tmux: `prefix + r`.
bind r source-file -F '#{TMUXDOTDIR}/tmux.conf' \; display-message "tmux.conf reloaded"

# Intuitive splits that keep the current pane's working directory.
#   prefix + |  → vertical split (side by side)
#   prefix + -  → horizontal split (stacked)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# New windows also inherit the current path.
bind c new-window -c "#{pane_current_path}"

# Vi-style pane navigation (prefix + h/j/k/l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi-style pane resizing, repeatable (hold the key after prefix).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-like copy-mode selection: v to start, y to yank.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Quick window switching with Alt+number (no prefix needed).
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
