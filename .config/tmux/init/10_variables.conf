### ─── 10_ variables & user options ────────────────────────────────────────
###
### User-defined options (@-prefixed) and config-level variables consumed by
### later stages or by plugins. TMUXDOTDIR itself is set in tmux.conf because
### it is needed to find this file.

# Where plugins are installed (kept under the config dir so the whole config is
# self-contained and portable).
set -g @plugin_dir "#{TMUXDOTDIR}/plugins"

# TPM looks here for plugins. Point it at our in-config plugin dir instead of
# the default ~/.tmux/plugins.
# NOTE: set-environment does NOT expand #{...} formats, so use $HOME literally.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
