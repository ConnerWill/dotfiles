### ─── 90_ local overrides (last-wins) ─────────────────────────────────────
###
### Loaded after options, keybindings, theme, and plugins — so anything here
### wins. Use it for machine-specific tweaks or to override a plugin/theme
### default you don't like.
###
### Example:
###   set -g status-position top
###   set -g @override_example 1
