### ─── 00_ base / server options ───────────────────────────────────────────
###
### First stage loaded by tmux.conf. Server- and terminal-level settings that
### everything else builds on. Keep this minimal.

# Use a modern, 256-color + truecolor capable terminal by default.
set -g default-terminal "tmux-256color"

# Truecolor (24-bit) passthrough for terminals that support it.
set -ga terminal-overrides ",*256col*:Tc,xterm-*:Tc,alacritty:Tc,wezterm:Tc"

# Responsive key handling: no delay after pressing Escape (important for vi mode
# and Neovim running inside tmux).
set -sg escape-time 10

# Larger scrollback buffer.
set -g history-limit 50000

# Allow apps (vim/nvim, fzf) to set the clipboard via OSC 52.
set -g set-clipboard on

# Focus events — lets Neovim/editors know when a pane gains/loses focus.
set -g focus-events on

# Index windows and panes from 1 (easier to reach on the keyboard).
set -g base-index 1
setw -g pane-base-index 1
