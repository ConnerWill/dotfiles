### ─── 20_ session & window options ────────────────────────────────────────
###
### Behavioral options for sessions, windows, and panes. Visual styling that
### belongs to the theme lives in 40_themes-colors.conf instead.

# Mouse: select/resize panes and windows, scroll into copy mode.
set -g mouse on

# Keep window numbers gapless when a window closes.
set -g renumber-windows on

# Let applications set the terminal title.
set -g set-titles on
set -g set-titles-string "#S:#I:#W"   # session:index:window

# Do not trigger an action on silence in monitored windows.
set -g silence-action none

# vi keys on the status/command line and in copy mode.
set -g status-keys vi
setw -g mode-keys vi

# Pane-number display colors (shown via `prefix + q`).
set -g display-panes-colour "#0599ff"
set -g display-panes-active-colour "#3aff00"

# How long (ms) pane numbers / messages stay on screen.
set -g display-panes-time 1500
set -g display-time 2000

# Monitor activity in other windows, but don't nag with a bell/message.
setw -g monitor-activity on
set -g visual-activity off

# Aggressive resize: size each window to the smallest *attached* client that is
# actively viewing it, not every client in the session.
setw -g aggressive-resize on
